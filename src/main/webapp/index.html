<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de cookies</title>
</head>
<body>

    <h1>Datos del usuario</h1>

    <form action="Servlet1" method="post">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="userName"
               minlength="2" maxlength="50" required>
        <br><br>

        <label for="ciudad">Ciudad:</label>
        <input type="text" id="ciudad" name="ciudad"
               minlength="2" maxlength="50" required>
        <br><br>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad"
               min="1" max="120" step="1" required>
        <br><br>

        <label for="estatura">Estatura en metros:</label>
        <input type="number" id="estatura" name="estatura"
               min="0.50" max="2.50" step="0.01" required>
        <br><br>

        <label for="novedades">
            <input type="checkbox" id="novedades"
                   name="novedades" value="true">
            Acepto recibir novedades
        </label>
        <br><br>

        <label for="hobby">Hobby favorito:</label>
		<select id="hobby" name="hobby" required>
    	<option value="">Selecciona un hobby</option>
    	<option value="LEER">Leer</option>
    	<option value="DEPORTE">Practicar deporte</option>
    	<option value="MUSICA">Escuchar música</option>
    	<option value="VIDEOJUEGOS">Jugar videojuegos</option>
    	<option value="BAILAR">Bailar</option>
    	<option value="OTRO">Otro</option>
		</select>
		<br><br>

        <button type="submit">Guardar datos</button>

    </form>

</body>
</html>
